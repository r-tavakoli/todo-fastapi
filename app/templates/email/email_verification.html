<!-- app/templates/email/verify_email_simple.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Verify Email</title>
</head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background: #f5f5f5;">
    <div style="background: white; padding: 30px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <h1 style="color: #333;">Verify Your Email</h1>
        
        <p>Hi <strong>{{ first_name }}</strong>,</p>
        
        <p>Please click the button below to verify your email address:</p>
        
        <p style="text-align: center; margin: 30px 0;">
            <a href="{{ verification_url }}" 
                style="background: #4CAF50; color: white; padding: 12px 30px; text-decoration: none; border-radius: 5px; display: inline-block;">
                Verify Email
            </a>
        </p>
        
        <p style="font-size: 14px; color: #666;">
            This link will expire in {{ expiry }}.
        </p>
        
        <hr style="border: 1px solid #eee; margin: 20px 0;">
        
        <p style="font-size: 12px; color: #999;">
            If you didn't sign up for {{ app_name }}, please ignore this email.
        </p>
    </div>
</body>
</html>
